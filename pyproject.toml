[tool.poetry]
name = "jogo-introcomp"
version = "3.0.0"
description = "Jogo de RPG de batalha por turnos desenvolvido em Python e Pygame para o Introcomp."
authors = ["Erick Schultz"]

[tool.poetry.dependencies]
python = ">=3.10.0"
pygame = "^2.1.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"